name: Build & Release Fluent Linker Pro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Stage release bundle
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $zipName = "FluentLinkerPro-$tag-win-x64.zip"
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $stage = "dist/FluentLinkerPro-win-x64"
          New-Item -ItemType Directory -Force -Path "$stage/assets" | Out-Null
          Copy-Item -Path build/Release/fluent_linker.exe -Destination $stage -Force
          Copy-Item -Path build/Release/*.dll -Destination $stage -Force -ErrorAction SilentlyContinue
          Copy-Item -Path assets/icon.ico -Destination "$stage/assets" -Force
          Copy-Item -Path assets/icon.png -Destination "$stage/assets" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath $zipName -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentLinkerPro-win-x64
          path: ${{ env.ZIP_NAME }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
